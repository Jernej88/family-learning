name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://jernej88.github.io
      BASE_PATH: /family-learning
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application and content
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: Verify root deployment build
        run: npm run test:root-build

      - name: Verify GitHub Pages deployment build
        run: npm run test:subpath
